<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my_seims · macOS SIEM</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ── Sidebar ────────────────────────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="brand">
    <span class="brand-icon"><i class="fa-solid fa-shield-halved"></i></span>
    <span class="brand-text">my_seims</span>
    <span class="brand-sub">macOS SIEM</span>
  </div>

  <div class="nav-section-label">MONITOR</div>
  <ul class="nav-list">
    <li><a href="#" class="nav-item active" data-page="dashboard">
      <i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a></li>
    <li><a href="#" class="nav-item" data-page="events">
      <i class="fa-solid fa-list-ul"></i><span>Events</span>
      <span class="nav-badge" id="badge-events"></span></a></li>
    <li><a href="#" class="nav-item" data-page="alerts">
      <i class="fa-solid fa-triangle-exclamation"></i><span>Alerts</span>
      <span class="nav-badge critical" id="badge-alerts"></span></a></li>
    <li><a href="#" class="nav-item" data-page="monitor">
      <i class="fa-solid fa-microchip"></i><span>Live Monitor</span>
      <span class="live-dot"></span></a></li>
  </ul>

  <div class="nav-section-label">MANAGE</div>
  <ul class="nav-list">
    <li><a href="#" class="nav-item" data-page="rules">
      <i class="fa-solid fa-sliders"></i><span>Detection Rules</span></a></li>
    <li><a href="#" class="nav-item" data-page="reports">
      <i class="fa-solid fa-file-pdf"></i><span>Reports</span></a></li>
    <li><a href="#" class="nav-item" data-page="settings">
      <i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
  </ul>

  <div class="sidebar-footer">
    <div class="scan-status" id="scan-status">
      <span class="status-dot idle" id="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>
    <button class="btn-scan" id="btn-scan-now">
      <i class="fa-solid fa-bolt"></i> Scan Now
    </button>
    <div class="server-btns">
      <button class="btn-server btn-restart" id="btn-restart" title="Restart server">
        <i class="fa-solid fa-rotate-right"></i> Restart
      </button>
      <button class="btn-server btn-stop" id="btn-stop" title="Stop server">
        <i class="fa-solid fa-power-off"></i> Stop
      </button>
    </div>
  </div>
</nav>

<!-- ── Main wrapper ───────────────────────────────────────────────────────── -->
<div id="main-wrapper">

  <!-- Topbar -->
  <header id="topbar">
    <div class="topbar-left">
      <h1 id="page-title">Dashboard</h1>
      <span class="page-subtitle" id="page-subtitle"></span>
    </div>
    <div class="topbar-right">
      <span class="last-scan-label">Last scan:</span>
      <span id="last-scan-time" class="last-scan-val">—</span>
      <label class="toggle-label" title="Auto-refresh every 30s">
        <input type="checkbox" id="auto-refresh-toggle" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>Auto-refresh</span>
      </label>
    </div>
  </header>

  <!-- Content -->
  <main id="content">
    <div id="page-loading" class="page-loading hidden">
      <div class="spinner"></div>
    </div>
    <div id="page-body"></div>
  </main>
</div>

<!-- ── Modal ─────────────────────────────────────────────────────────────── -->
<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer"></div>
  </div>
</div>

<!-- ── Restart overlay ──────────────────────────────────────────────────── -->
<div id="restart-overlay" class="hidden">
  <i class="fa-solid fa-rotate-right ro-icon"></i>
  <div class="ro-title" id="ro-title">Restarting…</div>
  <div class="ro-sub"  id="ro-sub">Please wait</div>
  <div class="ro-bar-wrap"><div class="ro-bar" id="ro-bar" style="width:0%"></div></div>
</div>

<!-- ── Toasts ─────────────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
